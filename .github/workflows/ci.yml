name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend CI (Test, Typecheck & Build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: azatech
          POSTGRES_PASSWORD: azatech_secret
          POSTGRES_DB: azatech_shop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install API Dependencies
        working-directory: api
        run: npm ci || npm install

      - name: Run Typecheck
        working-directory: api
        run: npm run typecheck

      - name: Deploy Prisma Migrations
        working-directory: api
        env:
          DATABASE_URL: postgresql://azatech:azatech_secret@localhost:5432/azatech_shop_test?schema=public
        run: npx prisma migrate deploy

      - name: Seed Test Database
        working-directory: api
        env:
          DATABASE_URL: postgresql://azatech:azatech_secret@localhost:5432/azatech_shop_test?schema=public
        run: npx prisma db seed

      - name: Run Automated Tests
        working-directory: api
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://azatech:azatech_secret@localhost:5432/azatech_shop_test?schema=public
          REDIS_URL: redis://localhost:6379
          RABBITMQ_URL: amqp://guest:guest@localhost:5672
          JWT_ACCESS_SECRET: test_jwt_access_secret_ci_12345
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_ci_12345
        run: npm test

      - name: Build API Bundle
        working-directory: api
        env:
          DATABASE_URL: postgresql://azatech:azatech_secret@localhost:5432/azatech_shop_test?schema=public
        run: npm run build

  frontend:
    name: Frontend CI (Typecheck & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies
        working-directory: web
        run: npm ci

      - name: Build Next.js Application
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: http://localhost:4000/api
        run: npm run build
